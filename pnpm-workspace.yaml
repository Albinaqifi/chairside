# pnpm settings. This is a single package, not a monorepo: pnpm keeps its settings in this file.

# Dependencies whose install scripts may run. None are needed: their prebuilt binaries
# come as regular packages.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  sharp: false
  unrs-resolver: false
