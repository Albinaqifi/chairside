# CI (E00-T06a, D-075): every pull request to main, every push to main, and once a week on main.
# What it runs, and how to run each step on your own machine: CLAUDE.md, "CI".
#
# The pipeline (.claude/skills/pipeline/SKILL.md) reads the step names: a red step named
# "Setup: …" or "pnpm audit --prod" stops it for the owner, any other red "pnpm …" step becomes a
# fix round. Keep that naming when you add or rename a step (D-078).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays at 05:17 UTC, on main: a new advisory shows without waiting for a pull request.
    - cron: '17 5 * * 1'

# The token can read the code and nothing else. The workflow uses no secrets.
permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels the older run of that pull request. Every run on main
  # (a push or the weekly run) has a group of its own, so it is never cancelled: in a shared group
  # GitHub cancels a waiting run when a newer one joins, even with cancel-in-progress false.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Next.js sends anonymous usage data unless this is set, in CI too (D-075).
  NEXT_TELEMETRY_DISABLED: '1'
  # The steps of pnpm check and the build run in UTC; the Auckland steps set their own zone.
  TZ: UTC

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Setup. When a setup step fails, the steps after it are skipped and the run is red.
      - name: 'Setup: check out'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Setup: pnpm'
        # No version here: it reads packageManager in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 'Setup: Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The version comes from engines.node in package.json.
          node-version-file: package.json
          # Caches the pnpm store, keyed on pnpm-lock.yaml.
          cache: pnpm

      - name: 'Setup: install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Setup: .env from .env.example'
        # Local values, not secrets (D-064, point 2), as on a developer machine.
        run: cp .env.example .env

      - name: 'Setup: start the database'
        id: database
        run: docker compose up -d --wait

      # Checks. Each one runs even when an earlier check failed, so one red run names every
      # failing check at once. None runs after a failed setup step: the database step is then
      # not a success. Never always(), which would keep a cancelled run going.
      - name: pnpm format:check
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: pnpm format:check

      - name: pnpm lint
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: pnpm lint

      - name: pnpm typecheck
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: pnpm typecheck

      - name: pnpm test
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: pnpm test

      - name: pnpm test:integration
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: pnpm test:integration

      - name: pnpm build
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: pnpm build

      # The Auckland steps: the same tests in a zone far from UTC. A test that passes in one zone
      # and fails in the other depends on the server's time zone (test-strategy.md, "Hidden local
      # time").
      - name: pnpm test (TZ=Pacific/Auckland)
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: pnpm test
        env:
          TZ: Pacific/Auckland

      - name: pnpm test:integration (TZ=Pacific/Auckland)
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: pnpm test:integration
        env:
          TZ: Pacific/Auckland

      # Dependency check (D-075). An advisory in a production dependency turns the run red.
      - name: pnpm audit --prod
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: pnpm audit --prod

      # Every dependency, development tools included: printed, and it turns nothing red. Never
      # --fix, --ignore or --ignore-unfixable: they write pnpm-workspace.yaml.
      - name: pnpm audit (all dependencies, printed only)
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: |
          if ! pnpm audit; then
            echo "::warning title=pnpm audit::Advisories found, listed in this step's log. Only pnpm audit --prod turns a run red (D-075)."
          fi
